<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJI 水印叠加工具</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            align-items: center;
        }
        .row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        select, input[type="file"], input[type="range"] {
            font-size: 14px;
            padding: 4px 8px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .slider-group input[type="range"] {
            width: 120px;
        }
        .slider-val {
            min-width: 40px;
            text-align: right;
            color: #666;
            font-variant-numeric: tabular-nums;
        }
        button {
            padding: 8px 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #007aff;
            color: #fff;
            font-size: 14px;
        }
        button:hover { background: #0062cc; }
        button.secondary {
            background: #f0f0f0;
            color: #333;
        }
        button.secondary:hover { background: #e0e0e0; }
        .canvas-wrap {
            margin-top: 16px;
            text-align: center;
            background: #fafafa;
            padding: 16px;
            border-radius: 8px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .placeholder {
            color: #999;
            font-size: 14px;
        }
        .status {
            font-size: 13px;
            color: #ff6b6b;
            margin-top: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>DJI 水印叠加工具</h2>

        <div class="row">
            <label>
                选择原图：
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
                <button id="pickBtn" class="secondary">选择图片</button>
            </label>
        </div>

        <div class="row">
            <label>
                水印方向：
                <select id="watermarkSelect">
                    <option value="16_9">横屏水印 (16:9)</option>
                    <option value="9_16">竖屏水印 (9:16)</option>
                </select>
            </label>
            <label>
                混合模式：
                <select id="blendMode">
                    <option value="screen" selected>Screen 滤色（黑底水印推荐）</option>
                    <option value="lighten">Lighten 增亮</option>
                    <option value="soft-light">Soft-Light 柔光</option>
                    <option value="multiply">Multiply 正片叠底</option>
                    <option value="source-over">正常叠加</option>
                </select>
            </label>
        </div>

        <div class="row">
            <div class="slider-group">
                <span>不透明度：</span>
                <input type="range" id="opacity" min="0" max="100" value="100">
                <span class="slider-val" id="opacityVal">100%</span>
            </div>
            <div class="slider-group">
                <span>水印大小：</span>
                <input type="range" id="scale" min="10" max="200" value="100">
                <span class="slider-val" id="scaleVal">100%</span>
            </div>
            <div class="slider-group">
                <span>位置 X：</span>
                <input type="range" id="posX" min="0" max="100" value="50">
                <span class="slider-val" id="posXVal">50%</span>
            </div>
            <div class="slider-group">
                <span>位置 Y：</span>
                <input type="range" id="posY" min="0" max="100" value="100">
                <span class="slider-val" id="posYVal">100%</span>
            </div>
        </div>

        <div class="row">
            <label>
                适配模式：
                <select id="fitMode">
                    <option value="contain" selected>Contain 完整显示（推荐）</option>
                    <option value="cover">Cover 铺满裁切</option>
                    <option value="original">Original 原始尺寸</option>
                </select>
            </label>
        </div>

        <div class="row">
            <label>
                导出格式：
                <select id="formatSelect">
                    <option value="jpeg" selected>JPG</option>
                    <option value="png">PNG</option>
                </select>
            </label>
            <div class="slider-group">
                <span>JPG 质量：</span>
                <input type="range" id="quality" min="0" max="100" value="100">
                <input type="number" id="qualityNum" min="0" max="100" value="100" style="width:64px;">
                <span class="slider-val" id="qualityVal">100%</span>
            </div>
        </div>

        <div class="row">
            <button id="downloadBtn">下载图片</button>
            <button id="resetBtn" class="secondary">重置参数</button>
        </div>

        <div class="status" id="status"></div>

        <div class="canvas-wrap" id="canvasWrap">
            <div class="placeholder" id="placeholder">请先选择一张图片</div>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const statusEl = document.getElementById('status');

        let originImg = null;
        let originFileName = '';
        let watermarks = {};
        let watermarkLoaded = { '16_9': false, '9_16': false };

        // 预加载水印
        function loadWatermark(key, src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    watermarks[key] = img;
                    watermarkLoaded[key] = true;
                    resolve(img);
                };
                img.onerror = (e) => {
                    statusEl.textContent = `水印图片加载失败：${src}`;
                    reject(e);
                };
                img.src = src;
            });
        }

        loadWatermark('16_9', './assets/water_16_9.png').catch(() => {});
        loadWatermark('9_16', './assets/water_9_16.png').catch(() => {});

        // 滑块值显示
        const sliders = ['opacity', 'scale', 'posX', 'posY'];
        sliders.forEach(id => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(id + 'Val');
            el.addEventListener('input', () => {
                valEl.textContent = el.value + '%';
                render();
            });
        });

        // 其他控件变化时重新渲染
        ['watermarkSelect', 'blendMode', 'fitMode'].forEach(id => {
            document.getElementById(id).addEventListener('change', render);
        });

        // 判断是否运行在原生 app 内（存在 WKWebView 的 messageHandler）
        function isNativeApp() {
            return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);
        }

        // 统一入口：用 dataURL 加载原图并渲染
        function loadOriginFromDataURL(dataURL, fileName) {
            originImg = new Image();
            if (fileName) originFileName = fileName;
            originImg.onload = () => {
                canvas.width = originImg.width;
                canvas.height = originImg.height;
                placeholder.style.display = 'none';
                canvas.style.display = 'inline-block';
                render();
            };
            originImg.onerror = () => {
                statusEl.textContent = '图片加载失败';
            };
            originImg.src = dataURL;
        }

        // 原生 app 回调：Swift 选完图片后注入 base64 调用此函数
        window.__onImagePicked = function (dataURL, fileName) {
            statusEl.textContent = '';
            loadOriginFromDataURL(dataURL, fileName);
        };

        // 选择图片按钮：原生环境走 Swift 文件面板，浏览器环境走 <input type=file>
        document.getElementById('pickBtn').addEventListener('click', function () {
            if (isNativeApp()) {
                window.webkit.messageHandlers.native.postMessage({ action: 'pickImage' });
            } else {
                document.getElementById('fileInput').click();
            }
        });

        // 浏览器环境：<input type=file> 兜底
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            statusEl.textContent = '';
            const reader = new FileReader();
            reader.onload = ev => loadOriginFromDataURL(ev.target.result, file.name);
            reader.onerror = () => {
                statusEl.textContent = '文件读取失败';
            };
            reader.readAsDataURL(file);
        });

        // 绘制水印（支持 contain / cover / original）
        function drawWatermark(ctx, img, canvasW, canvasH, fit, scale, posX, posY) {
            let renderW, renderH, offsetX, offsetY;

            if (fit === 'original') {
                // 原始尺寸，按 scale 缩放
                renderW = img.width * scale / 100;
                renderH = img.height * scale / 100;
                offsetX = (canvasW - renderW) * posX / 100;
                offsetY = (canvasH - renderH) * posY / 100;
            } else {
                const imgRatio = img.width / img.height;
                const dstRatio = canvasW / canvasH;

                if (fit === 'contain') {
                    if (imgRatio > dstRatio) {
                        renderW = canvasW;
                        renderH = canvasW / imgRatio;
                    } else {
                        renderH = canvasH;
                        renderW = canvasH * imgRatio;
                    }
                } else { // cover
                    if (imgRatio > dstRatio) {
                        renderH = canvasH;
                        renderW = canvasH * imgRatio;
                    } else {
                        renderW = canvasW;
                        renderH = canvasW / imgRatio;
                    }
                }

                // 应用 scale
                renderW = renderW * scale / 100;
                renderH = renderH * scale / 100;
                offsetX = (canvasW - renderW) * posX / 100;
                offsetY = (canvasH - renderH) * posY / 100;
            }

            ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
        }

        // 主渲染函数
        function render() {
            if (!originImg) return;

            const wmKey = document.getElementById('watermarkSelect').value;
            const watermarkImg = watermarks[wmKey];
            if (!watermarkImg) {
                statusEl.textContent = '水印图片加载中...';
                return;
            }

            const blendMode = document.getElementById('blendMode').value;
            const fitMode = document.getElementById('fitMode').value;
            const opacity = document.getElementById('opacity').value / 100;
            const scale = document.getElementById('scale').value;
            const posX = document.getElementById('posX').value;
            const posY = document.getElementById('posY').value;

            // 清空并绘制原图
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originImg, 0, 0);

            // 设置水印样式
            ctx.globalCompositeOperation = blendMode;
            ctx.globalAlpha = opacity;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // 绘制水印
            drawWatermark(ctx, watermarkImg, canvas.width, canvas.height, fitMode, scale, posX, posY);

            // 重置
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
        }

        // 质量控件：滑块与手动输入双向联动
        const qualitySlider = document.getElementById('quality');
        const qualityNum = document.getElementById('qualityNum');
        const qualityVal = document.getElementById('qualityVal');

        function syncQuality(val) {
            qualitySlider.value = val;
            qualityNum.value = val;
            qualityVal.textContent = val + '%';
        }
        qualitySlider.addEventListener('input', () => {
            qualityNum.value = qualitySlider.value;
            qualityVal.textContent = qualitySlider.value + '%';
        });
        qualityNum.addEventListener('input', () => {
            let v = parseInt(qualityNum.value, 10);
            if (isNaN(v)) v = 100;
            v = Math.min(100, Math.max(0, v));
            qualitySlider.value = v;
            qualityVal.textContent = v + '%';
        });

        // 切换格式：JPG 才需要质量参数，PNG 无损无需质量
        document.getElementById('formatSelect').addEventListener('change', () => {
            const isJpeg = document.getElementById('formatSelect').value === 'jpeg';
            qualitySlider.disabled = !isJpeg;
            qualityNum.disabled = !isJpeg;
        });

        // 下载
        document.getElementById('downloadBtn').addEventListener('click', function () {
            if (!originImg) {
                alert('请先上传图片');
                return;
            }

            const format = document.getElementById('formatSelect').value;
            const quality = qualitySlider.value / 100;

            let dataURL, ext;
            if (format === 'png') {
                // PNG 无损，保留透明通道，无需白底
                dataURL = canvas.toDataURL('image/png');
                ext = 'png';
            } else {
                // JPG 不支持透明通道，先铺白底避免透明区域导出后变黑
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                const ectx = exportCanvas.getContext('2d');
                ectx.fillStyle = '#ffffff';
                ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                ectx.drawImage(canvas, 0, 0);
                dataURL = exportCanvas.toDataURL('image/jpeg', quality);
                ext = 'jpg';
            }

            // 生成输出文件名：输入文件名 + _wm 后缀
            let outName;
            if (originFileName) {
                const dotIdx = originFileName.lastIndexOf('.');
                const base = dotIdx > 0 ? originFileName.slice(0, dotIdx) : originFileName;
                outName = base + '_wm.' + ext;
            } else {
                outName = 'dji-watermark.' + ext;
            }

            if (isNativeApp()) {
                // 原生环境：交给 Swift 用 NSSavePanel 保存
                window.webkit.messageHandlers.native.postMessage({
                    action: 'saveImage',
                    dataURL: dataURL,
                    filename: outName
                });
            } else {
                // 浏览器环境：a[download] 触发下载
                const link = document.createElement('a');
                link.download = outName;
                link.href = dataURL;
                link.click();
            }
        });

        // 重置
        document.getElementById('resetBtn').addEventListener('click', function () {
            document.getElementById('opacity').value = 100;
            document.getElementById('scale').value = 100;
            document.getElementById('posX').value = 50;
            document.getElementById('posY').value = 100;
            document.getElementById('blendMode').value = 'screen';
            document.getElementById('fitMode').value = 'contain';
            document.getElementById('formatSelect').value = 'jpeg';
            syncQuality(100);
            qualitySlider.disabled = false;
            qualityNum.disabled = false;
            sliders.forEach(id => {
                document.getElementById(id + 'Val').textContent = document.getElementById(id).value + '%';
            });
            render();
        });
    </script>
</body>
</html>
